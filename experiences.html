<body class="bg-stone-50 text-stone-800"><header class="bg-emerald-950 text-white"><div class="mx-auto flex max-w-6xl items-center justify-between px-5 py-5"><a class="text-xl font-bold" href="index.html">RUN AFRICA <span class="text-amber-300">EXPEDITIONS</span></a><div class="flex items-center gap-3"><div class="flex items-center rounded-lg border border-white/20 bg-white/10 p-1 text-xs font-bold" data-language-switcher aria-label="Language selector"><button data-language="en" class="rounded px-2 py-1" aria-pressed="true">EN</button><span aria-hidden="true">/</span><button data-language="sw" class="rounded px-2 py-1" aria-pressed="false">SW</button></div><a href="contact.html" class="rounded-lg border border-amber-300 px-4 py-2 text-sm hover:bg-amber-300 hover:text-emerald-950">Contact us</a></div></div></header>
<main class="mx-auto max-w-6xl px-5 py-14"><p id="eyebrow" class="font-semibold uppercase tracking-widest text-amber-700">Tanzania, your way</p><h1 id="title" class="mt-3 text-4xl font-bold text-emerald-950 md:text-5xl">Explore Tanzania</h1><p id="intro" class="mt-5 max-w-3xl text-lg leading-relaxed text-stone-600"></p><div id="gallery" class="mt-10 grid gap-6 md:grid-cols-3"></div><div class="mt-12 rounded-2xl bg-emerald-950 p-8 text-white"><h2 class="text-2xl font-bold">Ready to plan this experience?</h2><p class="mt-2 text-emerald-100">Our team can tailor dates, stays, transport, and activities around you.</p><a href="contact.html" class="mt-5 inline-block rounded-lg bg-amber-400 px-5 py-3 font-semibold text-emerald-950">Talk to Run Africa</a></div></main>
<script>
const photos=['IMG_6116%2013.59.49.JPG.jpeg','IMG_6195%2013.59.49.JPG.jpeg','IMG_6625%2013.59.50.JPG.jpeg','IMG_5664%2013.59.49.JPG.jpeg'];
const tours={wildlife:{title:'Wildlife Safaris',intro:'Explore Tanzania’s wildlife landscapes with a private guide, flexible 4x4 travel, and an itinerary built around the parks and season that suit you.',caption:['Guided safari moments','Landscape and adventure','Travel with Run Africa']},cultural:{title:'Cultural Tourism',intro:'Bagamoyo is our next planned cultural tourism experience. Meet communities respectfully, discover local stories, and enjoy meaningful coastal and cultural travel.',caption:['People and place','Local views','Bagamoyo: next on the journey']},coastal:{title:'Coastal Escapes',intro:'Slow down with a coast-focused Tanzania journey, combining local culture, scenery, and time to recharge.',caption:['Travel companions','Open-air experiences','Coastal journey']},mountain:{title:'Mountain Trekking',intro:'Choose a supported trekking experience with thoughtful pacing, local knowledge, and a practical travel plan.',caption:['The journey begins','Views worth the climb','Made for explorers']}};
const type=new URLSearchParams(location.search).get('tour')||'wildlife', data=tours[type]||tours.wildlife;
document.title=data.title+' | Run Africa Expeditions';document.getElementById('title').textContent=data.title;document.getElementById('intro').textContent=data.intro;document.getElementById('gallery').innerHTML=photos.slice(0,3).map((photo,index)=>`<figure class="overflow-hidden rounded-2xl bg-white shadow"><img class="h-72 w-full object-cover" src="../pictures/${photo}" alt="${data.title} photo ${index+1}"><figcaption class="p-4 font-medium">${data.caption[index]}</figcaption></figure>`).join('');
</script></body></html>
